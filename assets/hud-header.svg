<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050A14"/>
      <stop offset="1" stop-color="#0A1A2A"/>
    </linearGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.35" stop-color="#9EF6FF"/>
      <stop offset="1" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#00E5FF" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset="1" stop-color="#00E5FF" stop-opacity="0.35"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="300" rx="14" fill="url(#bg)"/>
  <rect width="1000" height="300" rx="14" fill="url(#grid)"/>

  <!-- Corner brackets -->
  <g stroke="#00E5FF" stroke-width="2" fill="none" opacity="0.8">
    <path d="M14 44V14H44"/><path d="M956 14H986V44"/>
    <path d="M14 256V286H44"/><path d="M956 286H986V256"/>
  </g>

  <!-- Reactor rings -->
  <g transform="translate(180 150)" filter="url(#glow)">
    <circle r="122" fill="none" stroke="#00E5FF" stroke-opacity="0.5" stroke-width="8" stroke-dasharray="1 7">
      <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="40s" repeatCount="indefinite"/>
    </circle>
    <circle r="108" fill="none" stroke="#00E5FF" stroke-width="2" stroke-dasharray="4 8">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite"/>
    </circle>
    <circle r="94" fill="none" stroke="#FFB000" stroke-width="3" stroke-dasharray="70 25 12 25">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle r="78" fill="none" stroke="#00E5FF" stroke-opacity="0.6" stroke-width="1"/>
    <circle r="66" fill="none" stroke="#00E5FF" stroke-width="7" stroke-dasharray="28 10">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/>
    </circle>
    <polygon points="0,-44 38,-22 38,22 0,44 -38,22 -38,-22" fill="none" stroke="#9EF6FF" stroke-width="2">
      <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="16s" repeatCount="indefinite"/>
    </polygon>
    <circle r="34" fill="url(#core)">
      <animate attributeName="r" values="28;36;28" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.75;1;0.75" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Text block -->
  <g font-family="Consolas, 'Courier New', monospace">
    <circle cx="368" cy="74" r="5" fill="#00FF9C">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <text x="382" y="79" fill="#00FF9C" font-size="14" letter-spacing="3">SYSTEM ONLINE // AI ASSISTANT v3.0</text>

    <text x="360" y="142" fill="#00E5FF" font-size="66" font-weight="bold" letter-spacing="10" filter="url(#glow)">R.U.D.Y.</text>
    <text x="362" y="172" fill="#9EEBFF" font-size="15" letter-spacing="5">RATIONAL UNIFIED DATA YIELDER</text>

    <rect x="362" y="188" height="2" fill="#00E5FF" width="0">
      <animate attributeName="width" values="0;420;420" keyTimes="0;0.3;1" dur="4s" repeatCount="indefinite"/>
    </rect>

    <text x="362" y="220" fill="#FFB000" font-size="15" letter-spacing="2">OPERATOR : MUHAMMAD RUDY HIDAYAT</text>
    <text x="362" y="246" fill="#9EEBFF" font-size="15" letter-spacing="2" opacity="0.85">BASE     : UNIVERSITAS SYIAH KUALA</text>
  </g>

  <!-- Equalizer bars -->
  <g fill="#00E5FF" opacity="0.85">
    <rect x="880" y="200" width="8" height="40"><animate attributeName="height" values="10;46;18;36;10" dur="1.4s" repeatCount="indefinite"/><animate attributeName="y" values="230;194;222;204;230" dur="1.4s" repeatCount="indefinite"/></rect>
    <rect x="894" y="200" width="8" height="40"><animate attributeName="height" values="30;12;44;20;30" dur="1.1s" repeatCount="indefinite"/><animate attributeName="y" values="210;228;196;220;210" dur="1.1s" repeatCount="indefinite"/></rect>
    <rect x="908" y="200" width="8" height="40"><animate attributeName="height" values="18;40;10;46;18" dur="1.7s" repeatCount="indefinite"/><animate attributeName="y" values="222;200;230;194;222" dur="1.7s" repeatCount="indefinite"/></rect>
    <rect x="922" y="200" width="8" height="40"><animate attributeName="height" values="40;20;34;12;40" dur="1.3s" repeatCount="indefinite"/><animate attributeName="y" values="200;220;206;228;200" dur="1.3s" repeatCount="indefinite"/></rect>
    <rect x="936" y="200" width="8" height="40"><animate attributeName="height" values="12;34;24;44;12" dur="1.5s" repeatCount="indefinite"/><animate attributeName="y" values="228;206;216;196;228" dur="1.5s" repeatCount="indefinite"/></rect>
  </g>
  <text x="880" y="262" fill="#5C8AA8" font-family="Consolas, 'Courier New', monospace" font-size="11" letter-spacing="2">NEURAL LINK</text>

  <!-- Scan line -->
  <rect x="0" y="-40" width="1000" height="40" fill="url(#scan)">
    <animate attributeName="y" values="-40;300" dur="4s" repeatCount="indefinite"/>
  </rect>
  <rect width="1000" height="300" rx="14" fill="none" stroke="#00E5FF" stroke-opacity="0.35"/>
</svg>
